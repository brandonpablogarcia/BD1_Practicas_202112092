services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bd1-fase2-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"

    ports:
      - "${DB_PORT:-1433}:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        - CMD-SHELL
        - >
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost
          -U sa
          -P "$${MSSQL_SA_PASSWORD}"
          -C
          -Q "SELECT 1"
          > /dev/null 2>&1
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s


  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bd1-fase2-sqlserver-init
    restart: "no"

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"

    volumes:
      - ./init.sql:/init.sql:ro

    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e

        echo "========================================="
        echo "Esperando conexion con SQL Server..."
        echo "========================================="

        until /opt/mssql-tools18/bin/sqlcmd \
          -S tcp:sqlserver,1433 \
          -U sa \
          -P "$${MSSQL_SA_PASSWORD}" \
          -C \
          -Q "SELECT 1" > /dev/null 2>&1
        do
          echo "SQL Server aun no esta disponible. Reintentando..."
          sleep 5
        done

        echo "========================================="
        echo "SQL Server disponible."
        echo "Ejecutando init.sql..."
        echo "========================================="

        /opt/mssql-tools18/bin/sqlcmd \
          -S tcp:sqlserver,1433 \
          -U sa \
          -P "$${MSSQL_SA_PASSWORD}" \
          -C \
          -b \
          -i /init.sql

        echo "========================================="
        echo "init.sql ejecutado correctamente."
        echo "Inicializacion terminada."
        echo "========================================="


volumes:
  sqlserver_data:
